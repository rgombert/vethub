<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="VetHub - Veterinary Clinic Management System by ilionx" />
		<meta name="theme-color" content="#E8003D" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
		%sveltekit.head%
		<script>
			// Apply the stored theme before first paint. Keep in sync with lib/theme/theme.svelte.ts
			(function () {
				try {
					var t = localStorage.getItem('vethub-theme');
					if (['light', 'dark', 'system', 'pastel'].indexOf(t) === -1) t = 'system';
					if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					var root = document.documentElement;
					if (t === 'dark') root.classList.add('dark');
					if (t === 'pastel') root.setAttribute('data-theme', 'pastel');
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
